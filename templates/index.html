<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Information System</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <div class="eyebrow">Academic administration</div>
          <h1>Faculty Information System</h1>
          <p class="subtitle">Manage faculty and departments from one simple workspace.</p>
        </div>
        <div class="stats">
          <div class="stat"><strong id="faculty-count">0</strong><span class="muted">Faculty</span></div>
          <div class="stat"><strong id="department-count">0</strong><span class="muted">Departments</span></div>
        </div>
      </header>

      <p id="notice" aria-live="polite"></p>

      <section class="layout">
        <div>
          <section class="card">
            <div class="card-header"><h2>Add department</h2></div>
            <form id="department-form">
              <div class="form-grid">
                <label>Department ID <input name="department_id" type="number" min="1" required placeholder="1" /></label>
                <label>Department name <input name="department_name" required minlength="2" placeholder="Computer Science" /></label>
                <label class="full">Description <textarea name="description" placeholder="Department overview"></textarea></label>
              </div>
              <div class="actions"><button class="button" type="submit">Add department</button></div>
            </form>
          </section>

          <section class="card">
            <div class="card-header"><h2>Departments</h2></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>ID</th><th>Name</th><th>Description</th><th></th></tr></thead>
                <tbody id="department-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>

        <div>
          <section class="card">
            <div class="card-header"><h2 id="faculty-form-title">Add faculty</h2></div>
            <form id="faculty-form">
              <div class="form-grid">
                <label>Faculty ID <input id="faculty_id" name="faculty_id" required pattern="[A-Za-z0-9_-]+" placeholder="FAC101" /></label>
                <label>Full name <input id="full_name" name="full_name" required minlength="2" placeholder="Dr. Eleanor Vance" /></label>
                <label>Email <input id="email" name="email" type="email" required placeholder="faculty@university.edu" /></label>
                <label>Phone <input id="phone" name="phone" maxlength="20" placeholder="+1-555-0142" /></label>
                <label>Date of birth <input id="date_of_birth" name="date_of_birth" type="date" /></label>
                <label>Department <select id="department_id" name="department_id" required></select></label>
                <label>Designation <input id="designation" name="designation" required placeholder="Professor" /></label>
                <label>Joining date <input id="joining_date" name="joining_date" type="date" /></label>
                <label>Status <select id="status" name="status"><option>Active</option><option>On Leave</option><option>Inactive</option></select></label>
                <label>Courses taught <textarea id="courses_taught" name="courses_taught" placeholder="Data Structures, Algorithms"></textarea></label>
                <label class="full">Experience history <textarea id="experience_history" name="experience_history" placeholder="Previous roles and institutions"></textarea></label>
              </div>
              <div class="actions">
                <button class="button" id="faculty-submit" type="submit">Add faculty</button>
                <button class="button secondary" id="faculty-cancel" type="button" hidden>Cancel edit</button>
              </div>
            </form>
          </section>

          <section class="card">
            <div class="card-header">
              <h2>Faculty records</h2>
              <div class="toolbar">
                <input id="faculty-search" type="search" placeholder="Search faculty..." aria-label="Search faculty" />
                <select id="status-filter" aria-label="Filter by status"><option value="">All statuses</option><option>Active</option><option>On Leave</option><option>Inactive</option></select>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Faculty</th><th>Contact</th><th>Department</th><th>Designation</th><th>Status</th><th></th></tr></thead>
                <tbody id="faculty-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="{{ url_for('static', path='app.js') }}"></script>
  </body>
</html>
